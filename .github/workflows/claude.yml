name: claude

# AI worker. Runs only when the owner or a collaborator mentions @claude.
# This job never gets server or deploy secrets (no `environment:`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      TARGET_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
      TARGET_NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/notify
        env:
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          SLACK_WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
        with:
          provider: ${{ vars.NOTIFY_PROVIDER || 'discord' }}
          channel: dev
          title: "AI 작업 시작: #${{ env.TARGET_NUM }}"
          summary: "${{ github.event.issue.title || github.event.pull_request.title }}"
          url: ${{ env.TARGET_URL }}

      # Lets the AI run the same checks as CI before opening a PR.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3, intl, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress && cp .env.example .env && php artisan key:generate

      - name: GitHub App token (bot identity)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ACP_APP_ID }}
          private-key: ${{ secrets.ACP_APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          branch_prefix: claude/
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit,Write,MultiEdit,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(vendor/bin/pest:*),Bash(vendor/bin/pint:*),Bash(vendor/bin/phpstan:*),Bash(php artisan make:*),Bash(php artisan test:*),Bash(composer audit:*),mcp__github_inline_comment__create_inline_comment"

      - if: always()
        uses: ./.github/actions/notify
        env:
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          SLACK_WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
        with:
          provider: ${{ vars.NOTIFY_PROVIDER || 'discord' }}
          channel: dev
          level: ${{ job.status == 'success' && 'info' || 'warn' }}
          title: "AI 작업 ${{ job.status == 'success' && '완료' || '실패' }}: #${{ env.TARGET_NUM }}"
          summary: "결과와 PR 링크는 이슈/PR 댓글에서 확인하세요."
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
