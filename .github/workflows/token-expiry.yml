name: token-expiry

# Tokens with an expiry date. Each date lives in a repository variable (YYYY-MM-DD).
# See docs/operations/secrets.md for how to renew each one.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - var: CLAUDE_TOKEN_EXPIRES
            label: Claude 토큰(CLAUDE_CODE_OAUTH_TOKEN)
          - var: INCIDENT_TOKEN_EXPIRES
            label: 장애 이슈용 토큰(GITHUB_INCIDENT_TOKEN, 서버 .env)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: days
        env:
          EXPIRES: ${{ vars[matrix.var] }}
          VAR: ${{ matrix.var }}
          LABEL: ${{ matrix.label }}
        run: |
          if [ -z "$EXPIRES" ]; then
            echo "level=warn" >> "$GITHUB_OUTPUT"
            echo "summary=저장소 변수 $VAR가 비어 있습니다. $LABEL 만료일을 적어 주세요." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          days=$(bash .github/scripts/days-until.sh "$EXPIRES")
          if [ "$days" -lt 0 ]; then
            echo "level=critical" >> "$GITHUB_OUTPUT"
            echo "summary=$LABEL이 ${EXPIRES}에 만료되었습니다. docs/operations/secrets.md의 방법으로 새로 발급하세요." >> "$GITHUB_OUTPUT"
          elif [ "$days" -le 30 ]; then
            echo "level=warn" >> "$GITHUB_OUTPUT"
            echo "summary=$LABEL 만료까지 ${days}일 남았습니다(${EXPIRES}). docs/operations/secrets.md의 방법으로 갱신하세요." >> "$GITHUB_OUTPUT"
          else
            echo "level=ok" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.days.outputs.level != 'ok'
        uses: ./.github/actions/notify
        env:
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          SLACK_WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
        with:
          provider: ${{ vars.NOTIFY_PROVIDER || 'discord' }}
          channel: dev
          level: ${{ steps.days.outputs.level }}
          title: "토큰 만료 알림: ${{ matrix.var }}"
          summary: ${{ steps.days.outputs.summary }}
          url: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/operations/secrets.md
