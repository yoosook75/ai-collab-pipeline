name: claude-review

# On-demand AI review: "@claude review" on a pull request (owner/collaborator only).
# Runs the review-only workflow; the development worker (claude.yml) ignores these comments.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    if: |
      (github.event.issue.pull_request || github.event.pull_request)
      && contains(github.event.comment.body, '@claude review')
      && contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.check.outputs.pr }}
    steps:
      - name: Refuse fork pull requests
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$NUM" --jq .head.repo.full_name)
          if [ "$head" != "$REPO" ]; then
            echo "::error::AI review does not run on pull requests from forks ($head)"
            exit 1
          fi
          echo "pr=$NUM" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ai-review-run.yml
    with:
      pr: ${{ fromJSON(needs.gate.outputs.pr) }}
    secrets: inherit
