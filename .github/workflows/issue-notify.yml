name: issue-notify

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify
        env:
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          SLACK_WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
        with:
          provider: ${{ vars.NOTIFY_PROVIDER || 'discord' }}
          channel: dev
          title: "이슈 접수: #${{ github.event.issue.number }} ${{ github.event.issue.title }}"
          summary: "작성자: ${{ github.event.issue.user.login }}"
          url: ${{ github.event.issue.html_url }}
