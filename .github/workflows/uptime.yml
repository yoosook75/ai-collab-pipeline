name: uptime

# External check: an app cannot report its own outage, so GitHub checks it from outside.
# Targets: this project's staging/production (/up) and, from the EXTRA_UPTIME_URLS secret
# (one URL per line), the other sites that share the same Caddy reverse proxy.
# Secret values are masked in public run logs.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe all targets
        id: probe
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          PROD_URL: ${{ vars.PROD_URL }}
          EXTRA: ${{ secrets.EXTRA_UPTIME_URLS }}
        run: |
          targets=()
          [ -n "$STAGING_URL" ] && targets+=("$STAGING_URL/up")
          [ -n "$PROD_URL" ] && targets+=("$PROD_URL/up")
          while IFS= read -r u; do u="${u//$'\r'/}"; [ -n "$u" ] && targets+=("$u"); done <<< "$EXTRA"

          worst=ok
          report=""
          for t in "${targets[@]}"; do
            res="$(bash .github/scripts/probe.sh "$t")"
            lvl="$(head -1 <<< "$res")"
            if [ "$lvl" != ok ]; then
              report+="${t}"$'\n'"$(tail -n +2 <<< "$res" | sed 's/^/  - /')"$'\n'
              if [ "$lvl" = critical ] || [ "$worst" = ok ]; then worst="$lvl"; fi
            fi
          done

          echo "checked ${#targets[@]} target(s): $worst"
          echo "level=$worst" >> "$GITHUB_OUTPUT"
          { echo "summary<<EOF_SUM"; printf '%s' "$report"; echo "EOF_SUM"; } >> "$GITHUB_OUTPUT"

      - if: steps.probe.outputs.level != 'ok'
        uses: ./.github/actions/notify
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          SLACK_WEBHOOK_OPS: ${{ secrets.SLACK_WEBHOOK_OPS }}
        with:
          provider: ${{ vars.NOTIFY_PROVIDER || 'discord' }}
          channel: ops
          level: ${{ steps.probe.outputs.level }}
          title: "가동 확인 이상"
          summary: ${{ steps.probe.outputs.summary }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
