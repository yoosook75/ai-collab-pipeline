name: risk-and-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  risk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      level: ${{ steps.classify.outputs.level }}
      files: ${{ steps.classify.outputs.files }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR" --name-only > changed.txt
          bash .github/scripts/classify-risk.sh changed.txt > result.txt
          level="$(head -1 result.txt)"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF_FILES"
            tail -n +2 result.txt
            echo "EOF_FILES"
          } >> "$GITHUB_OUTPUT"
          echo "risk: $level"; tail -n +2 result.txt

      - name: Apply label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LEVEL: ${{ steps.classify.outputs.level }}
        run: |
          other=$([ "$LEVEL" = high ] && echo low || echo high)
          gh pr edit "$PR" --add-label "risk:$LEVEL" --remove-label "risk:$other"

      - name: Ask for a careful human look
        if: steps.classify.outputs.level == 'high'
        uses: ./.github/actions/notify
        env:
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          SLACK_WEBHOOK_DEV: ${{ secrets.SLACK_WEBHOOK_DEV }}
        with:
          provider: ${{ vars.NOTIFY_PROVIDER || 'discord' }}
          channel: dev
          level: warn
          title: "사람 확인 필요 (risk:high): #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}"
          summary: ${{ steps.classify.outputs.files }}
          url: ${{ github.event.pull_request.html_url }}

  ai-review:
    # Review once, when the PR is first opened. Ask again with "@claude review".
    needs: risk
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub App token (bot identity)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ACP_APP_ID }}
          private-key: ${{ secrets.ACP_APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            저장소 ${{ github.repository }}의 PR #${{ github.event.pull_request.number }}를 한국어로 리뷰하세요.
            - `gh pr diff ${{ github.event.pull_request.number }}`로 변경 내용을 보고, 버그·보안·테스트 누락 위주로 의견을 남기세요.
            - 구체적인 줄 지적은 인라인 댓글로, 전체 요약은 PR 댓글 하나로 남기세요.
            - 코드를 수정하거나 커밋하지 마세요.
            - 이 PR의 위험도는 `${{ needs.risk.outputs.level }}`입니다.
              위험도가 `high`면 `gh pr edit --body`로 PR 본문 맨 위에 다음 섹션을 추가하세요(기존 본문은 그 아래에 그대로 둡니다):
              "## 고위험 변경 요약" — 무엇을 / 왜 / 영향 범위, 그리고 아래 위험 파일 목록.
            위험 파일 목록:
            ${{ needs.risk.outputs.files }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
